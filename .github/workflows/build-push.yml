name: Build & Push API → GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/claudygod-musicministries/cgm-api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN is sufficient to check out this repository.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Setup .NET 8
        shell: bash
        run: |
          set -euo pipefail

          # ubuntu-latest normally includes .NET 8.
          # Install it only when dotnet is unavailable.
          if ! command -v dotnet >/dev/null 2>&1; then
            echo "❌ dotnet not found — installing .NET 8 SDK"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              https://dot.net/v1/dotnet-install.sh \
              --output /tmp/dotnet-install.sh

            bash /tmp/dotnet-install.sh \
              --channel 8.0 \
              --install-dir "$HOME/.dotnet"

            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
            export PATH="$HOME/.dotnet:$PATH"
          fi

          dotnet --version
          dotnet --list-sdks

      - name: Restore dependencies
        run: dotnet restore ClaudyGod.sln

      - name: Verify formatting
        run: dotnet format ClaudyGod.sln --no-restore --verify-no-changes

      - name: Audit dependency graph
        run: >-
          dotnet list ClaudyGod.sln package
          --vulnerable
          --include-transitive

      - name: Build
        run: dotnet build ClaudyGod.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test ClaudyGod.sln
          --no-build
          --configuration Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

  # ─── Build + Push ────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN is sufficient to check out this repository.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Get short SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=ref,event=pr,prefix=pr-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Hand off to the infrastructure repository ─────────────────────────────
      # ClaudyGodweb-Infrastructure is the source of truth for production.
      # It owns Docker Compose, deployment, and database migration execution.
      - name: Trigger deploy in ClaudyGodweb-Infrastructure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_PAT:-}" ]; then
            echo "❌ GH_PAT secret is not set."
            echo "The token needs access to ClaudyGodweb-Infrastructure."
            echo "Add it under:"
            echo "CGM-Backend → Settings → Secrets and variables → Actions"
            exit 1
          fi

          TAG="sha-${{ steps.sha.outputs.short }}"

          echo "→ Dispatching deploy-api with image tag: ${TAG}"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/dispatch_response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${GH_PAT}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/ClaudyGod-MusicMinistries/ClaudyGodweb-Infrastructure/dispatches \
              --data "{\"event_type\":\"deploy-api\",\"client_payload\":{\"service\":\"api\",\"tag\":\"${TAG}\"}}"
          )"

          if [ "$http_code" != "204" ]; then
            echo "❌ Repository dispatch failed with HTTP ${http_code}."

            if [ -s /tmp/dispatch_response.json ]; then
              cat /tmp/dispatch_response.json
            fi

            exit 1
          fi

          echo "✓ Deployment dispatched successfully."
          echo "✓ Infrastructure will deploy ${TAG} and run migrations."

      - name: Build summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "### ✅ API image pushed to GHCR"
            echo
            echo "| Detail | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ env.IMAGE_NAME }}\` |"
            echo "| SHA | \`${{ steps.sha.outputs.short }}\` |"

            if [ "${{ github.ref }}" = "refs/heads/main" ] &&
               [ "${{ github.event_name }}" = "push" ]; then
              echo "| Deploy | ➡️ Dispatched to ClaudyGodweb-Infrastructure |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"