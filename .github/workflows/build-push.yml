name: Build & Push API → GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/claudygod-musicministries/cgm-api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN is sufficient to check out the repo this workflow
          # runs in — no custom PAT secret to configure/rotate.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Setup .NET 8
        run: |
          # ubuntu-latest ships .NET 8, but ensure it's the default
          if ! command -v dotnet &> /dev/null; then
            echo "❌ dotnet not found — installing .NET 8 SDK"
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 8.0
            echo "$HOME/.dotnet" >> $GITHUB_PATH
          fi
          dotnet --version
          dotnet --list-sdks

      - name: Restore dependencies
        run: dotnet restore ClaudyGod.sln

      - name: Verify formatting
        run: dotnet format ClaudyGod.sln --no-restore --verify-no-changes

      - name: Audit dependency graph
        run: dotnet list ClaudyGod.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build ClaudyGod.sln --no-restore -c Release

      - name: Test
        run: >-
          dotnet test ClaudyGod.sln --no-build -c Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  # ─── Build + Push ────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN is sufficient to check out the repo this workflow
          # runs in — no custom PAT secret to configure/rotate.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=ref,event=pr,prefix=pr-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Hand off to the infrastructure repo ──────────────────────────────────
      # ClaudyGodweb-Infrastructure is the single source of truth for what runs
      # on the production server — it owns the docker-compose.yml, the SSH
      # deploy script, AND the one-shot `migrate` service. This repo has no
      # business SSHing into the VPS or applying migrations itself; doing both
      # here AND in the infra repo's own deploy.yml was two independent,
      # divergent deploy paths racing to manage the same containers (one of
      # them still had the pre-rename service name and would have broken or
      # deleted the frontend container the same way the direct deploy.yml
      # partial-deploy bug already did once). Repository_dispatch is the one
      # integration point between the two repos — infra's deploy.yml has
      # listened for `deploy-api` from day one; this step is what actually
      # calls it.
      - name: Trigger deploy in ClaudyGodweb-Infrastructure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "❌ GH_PAT secret is not set (needs repo scope on ClaudyGodweb-Infrastructure)."
            echo "Add it in GitHub → CGM-Backend → Settings → Secrets and variables → Actions"
            exit 1
          fi

          TAG="sha-${{ steps.sha.outputs.short }}"
          echo "→ Dispatching deploy-api (tag=$TAG) to ClaudyGodweb-Infrastructure..."

          http_code=$(curl -sS -o /tmp/dispatch_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ClaudyGod-MusicMinistries/ClaudyGodweb-Infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-api\",\"client_payload\":{\"service\":\"api\",\"tag\":\"${TAG}\"}}")

          if [ "$http_code" != "204" ]; then
            echo "❌ Dispatch failed (HTTP $http_code):"
            cat /tmp/dispatch_response.json
            exit 1
          fi
          echo "✓ Deploy dispatched — infra repo will pull ${TAG}, run migrations, and restart claudygod-api"

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ✅ API Image Pushed to GHCR"
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Image | \`${{ env.IMAGE_NAME }}\` |"
            echo "| SHA | \`${{ steps.sha.outputs.short }}\` |"
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
              echo "| Deploy | ➡️ Dispatched to ClaudyGodweb-Infrastructure |"
            fi
          } >> $GITHUB_STEP_SUMMARY
