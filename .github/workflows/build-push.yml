name: Build & Push API → GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/claudygod-musicministries/cgm-api

# Prevent concurrent deployments to production
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only use PAT for push events (internal branches)
          # For PRs from forks, fall back to the default GITHUB_TOKEN
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.GH_PAT }}
          # For PRs, checkout the PR head commit, not the merge ref
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore ClaudyGod.sln

      - name: Build
        run: dotnet build ClaudyGod.sln --no-restore -c Release

      - name: Test
        run: dotnet test ClaudyGod.sln --no-build -c Release --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  # ─── Build + Push ────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short-sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.GH_PAT }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=ref,event=pr,prefix=pr-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Run migrations from CI runner ───────────────────────────────────────
      - name: Run database migrations
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          MIGRATE_CONN: ${{ secrets.MIGRATE_CONNECTION_STRING }}
        run: |
          if [ -z "$MIGRATE_CONN" ]; then
            echo "❌ MIGRATE_CONNECTION_STRING secret is not set."
            echo ""
            echo "Add it in GitHub → CGM-Backend → Settings → Secrets and variables →"
            echo "Actions → New repository secret"
            echo ""
            echo "  Name:  MIGRATE_CONNECTION_STRING"
            echo "  Value: <your-supabase-connection-string>"
            exit 1
          fi

          IMAGE_TAG="${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}"
          
          echo "→ Pulling image: ${IMAGE_TAG}"
          docker pull "${IMAGE_TAG}"

          echo "→ Applying EF Core migrations..."
          docker run --rm \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e "ConnectionStrings__DefaultConnection=${MIGRATE_CONN}" \
            "${IMAGE_TAG}" \
            --migrate

          echo "✓ Migrations applied successfully"

      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ✅ API Image Pushed to GHCR"
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Image | \`${{ env.IMAGE_NAME }}\` |"
            echo "| Tags | \`latest\`, \`sha-${{ steps.sha.outputs.short }}\` |"
            echo "| Migrations | ✅ Applied |"
          } >> $GITHUB_STEP_SUMMARY

  # ─── Deploy to Production ────────────────────────────────────────────────────
  deploy:
    name: Deploy API to production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout infrastructure code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 300s
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            
            # Trim any whitespace from deploy path
            DEPLOY_PATH="$(echo '${{ secrets.VPS_DEPLOY_PATH }}' | tr -d '[:space:]')"
            cd "$DEPLOY_PATH" || { echo "❌ Failed to cd into $DEPLOY_PATH"; exit 1; }

            # Authenticate to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # Set image tag from build output
            export TAG="sha-${{ needs.build.outputs.short-sha }}"
            export IMAGE="${{ env.IMAGE_NAME }}:${TAG}"

            COMPOSE="docker compose \
              --env-file $DEPLOY_PATH/.env \
              --project-directory $DEPLOY_PATH \
              -f $DEPLOY_PATH/docker/docker-compose.yml"

            echo "→ Pulling API image: ${IMAGE}"
            $COMPOSE pull api

            echo "→ Deploying API (2 replicas)..."
            $COMPOSE up -d --no-deps --remove-orphans --scale api=2 api

            # Clean up old images
            docker image prune -f --filter "until=24h" >/dev/null 2>&1 || true
            
            echo "✓ Deploy complete — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Production Deploy Successful" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.IMAGE_NAME }}:sha-${{ needs.build.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Production Deploy Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi